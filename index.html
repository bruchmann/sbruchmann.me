<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>🖕</title>

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<style>
		@font-face {
			font-family: Atkinson Hyperlegible Mono;
			font-style: normal;
			font-weight: 200 800;
			font-display: swap;
			src:
				local("Atkinson Hyperlegible Mono"),
				url("/atkinson-variable-mono.ttf");
		}

		:root {
			--black: #100F0F;
			--paper: #FFFCF0;
			--base-200: #CECDC3;

			font-family: monospace;
			font-size: clamp(1em, 1em + 0.5vmin, 1.5em);
			font-synthesis: none;
			text-rendering: optimizeLegibility;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
			line-height: 1.5;
			color-scheme: dark light;
			color: var(--black);
			background-color: var(--paper);

			@media (prefers-color-scheme: dark) {
				color: var(--base-200);
				background-color: var(--black);
			}
		}

		html {
			scrollbar-gutter: stable;
		}

		body {
			display: grid;
			place-content: center;
			min-block-size: 100svb;
			margin: 0;
		}

		p {
			margin: 0 2.5vmax;
			text-wrap: pretty;
		}

		.line {
			display: block;
		}
	</style>

	<link rel="favicon" href="/favicon.ico">
</head>

<body>
	<p>
		<span class="line">There was a website here.</span>
		<span class="line">It's gone now.</span>
	</p>
</body>

</html>
