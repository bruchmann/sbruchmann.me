<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>🖕</title>

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<style>
		@font-face {
			font-family: Atkinson Hyperlegible Mono;
			font-style: normal;
			font-weight: 200 800;
			font-display: swap;
			src:
				local("Atkinson Hyperlegible Mono"),
				url("/atkinson-variable-mono.ttf");
		}

		@keyframes flickering {
			0% {
				opacity: 0;
			}

			10% {
				opacity: 1;
			}

			14% {
				opacity: 0;
			}

			16% {
				opacity: 1;
			}

			22% {
				opacity: 0;
			}

			42% {
				opacity: 1;
			}

			58% {
				opacity: 0;
			}

			78% {
				opacity: 1;
			}

			78% {
				opacity: 0;
			}

			85% {
				opacity: 1;
			}

			98% {
				opacity: 0;
			}

			100% {
				opacity: 1;
			}
		}

		html {
			--black: #100F0F;
			--paper: #FFFCF0;
			--base-200: #CECDC3;

			scrollbar-gutter: stable;
			font-family: monospace;
			font-size: clamp(1em, 1em + 0.5vmin, 1.5em);
			font-synthesis: none;
			text-rendering: optimizeLegibility;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
			line-height: 1.5;
			color-scheme: dark light;
			color: var(--black);
			background-color: var(--paper);

			@media (prefers-color-scheme: dark) {
				color: var(--base-200);
				background-color: var(--black);
			}
		}

		body {
			display: grid;
			place-content: center;
			min-block-size: 100svb;
			margin: 0;
		}

		p {
			font-size: max(1.5rem, 25svmin);
			font-weight: 800;
			line-height: 1;
			margin: 0;
			white-space: nowrap;
		}

		.line {
			display: block;
		}

		.line.nzs,
		.line.afd {
			animation: flickering 3s infinite linear;
		}

		.line.nzs {
		}

		.line.afd {
			margin-block-start: -1lh;
			animation-delay: 0.2s;
		}
	</style>

	<link rel="favicon" href="/favicon.ico">
</head>

<body>
	<p>
		<span class="line">FCK</span>
		<span class="line nzs">NZS</span>
		<span class="line afd">AFD</span>
	</p>
</body>

</html>
